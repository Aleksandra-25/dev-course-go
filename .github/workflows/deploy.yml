name: Build and Deploy Go App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted # Указываем, что будем использовать ваш ПК, а не серверы GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-go-app:latest .

      - name: Stop and remove old container
        run: |
          docker stop my-app || true
          docker rm my-app || true

      - name: Run new container
        run: docker run -d -p 8080:8080 --name my-app my-go-app:latest
